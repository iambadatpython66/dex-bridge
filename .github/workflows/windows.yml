name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified dependencies
        run: node scripts/download-tools.mjs
      - name: Extract scrcpy
        shell: powershell
        run: Expand-Archive -LiteralPath build-cache/scrcpy-win64-v5.0.1.zip -DestinationPath build-cache/scrcpy -Force
      - name: Build Windows app
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build.ps1
      - name: Test device compatibility and native interface
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeX-Bridge-Windows-x64
          path: dist/DeX-Bridge-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-ui-captures
          path: .impeccable/review/windows-*.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeX-Bridge-Windows-x64
          path: release
      - name: Publish Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" release/DeX-Bridge-Windows-x64.zip --title "DeX Bridge $env:RELEASE_TAG" --notes-file CHANGELOG.md --prerelease
